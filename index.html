async function startImport(file) {
  Sound.prime();
  if (!/\.(xlsx|xlsm)$/i.test(file.name)) {
    S.upload = { filename: file.name, stage: 'error', error: { userMessage: 'Please choose an Excel workbook ending in .xlsx or .xlsm.', detail: 'Selected file: ' + file.name } };
    Sound.play('error'); haptic([18, 50, 18]);
    render(); return;
  }
  const steps = [{ label: 'Reading Trainer Duties…', state: 'active' }, { label: 'Identifying Trainers…', state: '' }, { label: 'Reading duties…', state: '' }, { label: 'Validating roster…', state: '' }];
  if (S.model) steps.push({ label: 'Comparing roster versions…', state: '' });
  S.upload = { filename: file.name, stage: 'reading', steps };
  render();
  const advance = async i => { steps.forEach((s, k) => s.state = k < i ? 'done' : k === i ? 'active' : ''); if (S.route === 'upload') render(); await sleep(240); };
  try {
    const buf = await file.arrayBuffer();
    const wb = await TD.readWorkbook(buf, file.name);
    await advance(1);
    let model;
    await new Promise(r => setTimeout(r, 0));
    model = TD.parseWorkbook(wb, () => { });
    await advance(2);
    await advance(3);
    if (!model.stats.duties) throw Object.assign(new Error('No duties found'), { userMessage: 'The workbook was read, but no Trainer duties were found in it.', detail: 'Sheets: ' + wb.sheets.map(s => s.name).join(', ') });
    let d = null;
    const view = applyHidden(model);
    if (S.model) { await advance(4); d = TD.diff(S.model, view); }
    steps.forEach(s => s.state = 'done');
    const same = d && !d.changes.length && !d.monthsAdded.length && !d.monthsRemoved.length && !d.trainersAdded.length && !d.trainersRemoved.length;
    Sound.play('tick'); haptic(8);
    S.upload = { filename: file.name, stage: 'preview', model, view, diff: d, same, steps: [...steps, { label: 'Roster ready', state: 'done' }] };
    render();
  } catch (err) {
    console.error(err);
    S.upload = { filename: file.name, stage: 'error', error: err };
    Sound.play('error'); haptic([18, 50, 18]);
    render();
  }
}
async function activateUpload() {
  const u = S.upload; if (!u || u.busy) return;
  Sound.prime();
  u.busy = true; u.activateError = null; render();
  try {
    const { meta, model } = await Roster.activate(u.model);

/* ---------- feedback: sound, haptics, toasts, celebrations ---------- */
const Sound = {
  ctx: null,
  on() { return prefs.get('sound', true); },
  prime() { // call inside a tap so iOS allows audio later
    if (!this.on()) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      if (!this.ctx) this.ctx = new AC();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch { }
  },
  tone(freq, at, dur, type, vol) {
    const c = this.ctx, t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  play(kind) {
    if (!this.on()) return;
    this.prime(); if (!this.ctx) return;
    try {
      if (kind === 'success') { // bright rising chime
        this.tone(659.25, 0, 0.45, 'sine', 0.09); this.tone(987.77, 0.09, 0.55, 'sine', 0.08);
        this.tone(1318.51, 0.18, 0.8, 'sine', 0.07); this.tone(1975.53, 0.27, 0.6, 'sine', 0.025);
      } else if (kind === 'unlock') {
        this.tone(880, 0, 0.16, 'sine', 0.06); this.tone(1318.51, 0.07, 0.3, 'sine', 0.05);
      } else if (kind === 'tick') {
        this.tone(1174.66, 0, 0.14, 'sine', 0.045);
      } else if (kind === 'error') {
        this.tone(329.63, 0, 0.2, 'triangle', 0.07); this.tone(246.94, 0.13, 0.32, 'triangle', 0.07);
      }
    } catch { }
  }
};
const haptic = pattern => { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch { } };
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function toast(msg, { kind = 'success', sub = '', sound = true, ms = 3400 } = {}) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div');
  t.className = `toast glass t-${kind}`;
  t.setAttribute('role', kind === 'error' ? 'alert' : 'status');
  t.innerHTML = `<span class="t-ic">${kind === 'error' ? I.alert : kind === 'info' ? I.info : I.check}</span>
    <span class="t-body"><b>${esc(msg)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>
    <i class="t-bar" style="animation-duration:${ms}ms"></i>`;
  const close = () => { if (!t.isConnected) return; t.classList.add('out'); setTimeout(() => t.remove(), reduceMotion() ? 0 : 260); };
  t.addEventListener('click', close);
  document.body.appendChild(t);
  setTimeout(close, ms);
  if (sound) Sound.play(kind === 'error' ? 'error' : 'tick');
  haptic(kind === 'error' ? [18, 50, 18] : 10);
}

function celebrate({ title, sub = '', facts = [], primary, secondary }) {
  document.querySelectorAll('.celebrate').forEach(x => x.remove());
  const el = document.createElement('div');
  el.className = 'celebrate';
  const sparks = Array.from({ length: 10 }, (_, i) => `<i style="--a:${i * 36}deg;--d:${(i % 3) * 60}ms"></i>`).join('');
  el.innerHTML = `<div class="cele-card glass" role="dialog" aria-modal="true" aria-labelledby="celeTitle">
      <div class="cele-badge">
        <span class="sparks" aria-hidden="true">${sparks}</span>
        <span class="cele-disc"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="ring" cx="40" cy="40" r="34"/><path class="tick" d="M26 41.5l9.5 9.5L55 31"/></svg></span>
      </div>
      <h2 id="celeTitle">${esc(title)}</h2>
      ${sub ? `<p class="cele-sub">${sub}</p>` : ''}
      ${facts.length ? `<div class="cele-facts">${facts.map(([v, l]) => `<span><b>${esc(v)}</b><small>${esc(l)}</small></span>`).join('')}</div>` : ''}
      <div class="cele-actions">
        ${primary ? `<button class="btn primary" data-cele="p">${esc(primary.label)}</button>` : ''}
        ${secondary ? `<button class="btn" data-cele="s">${esc(secondary.label)}</button>` : ''}
      </div>
    </div>`;
  const close = fn => { el.classList.add('out'); setTimeout(() => { el.remove(); fn && fn(); }, reduceMotion() ? 0 : 220); };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-cele]');
    if (b) close(b.dataset.cele === 'p' ? primary.action : secondary.action);
    else if (e.target === el) close();
  });
  document.addEventListener('keydown', function esc_(e) { if (e.key === 'Escape') { document.removeEventListener('keydown', esc_); close(); } });
  document.body.appendChild(el);
  const f = el.querySelector('[data-cele]'); if (f) setTimeout(() => f.focus(), 50);
  Sound.play('success');
  haptic([12, 60, 24]);
}

function confirmSheet({ title, text, ok = 'Confirm', danger = false }) {
  return new Promise(resolve => {
    openSheet(`<div class="confirm">
      <span class="confirm-ic ${danger ? 'danger' : ''}">${danger ? I.alert : I.info}</span>
      <h2>${esc(title)}</h2><p class="muted">${esc(text)}</p>
      <div class="confirm-actions"><button class="btn ${danger ? 'danger-fill' : 'primary'}" data-ok>${esc(ok)}</button><button class="btn" data-close>Cancel</button></div>
    </div>`);
    const s = $('#scrim');
    let done = false;
    const finish = v => { if (done) return; done = true; resolve(v); };
    $('[data-ok]', s).addEventListener('click', () => { Sound.prime(); finish(true); closeSheet(); });
    new MutationObserver((_, obs) => { if (!document.contains(s)) { obs.disconnect(); finish(false); } }).observe(document.body, { childList: true });
    setTimeout(() => $('[data-ok]', s) && $('[data-ok]', s).focus(), 30);
  });
}

});
})();
