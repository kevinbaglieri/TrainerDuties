  --glass: rgba(255, 255, 255, .64); --glass-strong: rgba(255, 255, 255, .86); --glass-soft: rgba(255, 255, 255, .42);
  --line: rgba(40, 24, 110, .10); --line-strong: rgba(40, 24, 110, .18); --highlight: rgba(255, 255, 255, .9);
  --ink: #17132E; --ink-2: #544C74; --ink-3: #857DA6;
  --violet: #5B3FE0; --violet-ink: #4A2FC9; --violet-soft: rgba(91, 63, 224, .10); --lavender: #7D66E8; --blue: #3E78D6;
  --shadow: 0 18px 50px -24px rgba(44, 26, 120, .35), 0 2px 6px rgba(44, 26, 120, .06);
  --c-training: #6A4CF0; --c-observation: #9B7CF5; --c-office: #3E78D6; --c-off: #8C87A3; --c-leave: #D9825E; --c-other: #6E7896;
  --scheme: light;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0A1F; --bg-2: #110E2C;
    --atmos-1: rgba(124, 92, 255, .30); --atmos-2: rgba(92, 140, 255, .14); --atmos-3: rgba(170, 120, 255, .12);
    --glass: rgba(255, 255, 255, .055); --glass-strong: rgba(30, 25, 66, .92); --glass-soft: rgba(255, 255, 255, .035);
    --line: rgba(255, 255, 255, .09); --line-strong: rgba(255, 255, 255, .16); --highlight: rgba(255, 255, 255, .12);
    --ink: #F3F0FF; --ink-2: #ADA6CC; --ink-3: #7A7399;
    --violet: #8E72FF; --violet-ink: #B8A6FF; --violet-soft: rgba(142, 114, 255, .16); --lavender: #CFC3FF; --blue: #8FB8FF;
    --shadow: 0 24px 60px -28px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .04) inset;
    --c-training: #9A82FF; --c-observation: #CDBDFF; --c-office: #8FB8FF; --c-off: #7F7A99; --c-leave: #F2B79B; --c-other: #A3ABC6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"], :root[data-td="dark"] {
  --bg: #0B0A1F; --bg-2: #110E2C;
  --atmos-1: rgba(124, 92, 255, .30); --atmos-2: rgba(92, 140, 255, .14); --atmos-3: rgba(170, 120, 255, .12);
  --glass: rgba(255, 255, 255, .055); --glass-strong: rgba(30, 25, 66, .92); --glass-soft: rgba(255, 255, 255, .035);
  --line: rgba(255, 255, 255, .09); --line-strong: rgba(255, 255, 255, .16); --highlight: rgba(255, 255, 255, .12);
  --ink: #F3F0FF; --ink-2: #ADA6CC; --ink-3: #7A7399;
  --violet: #8E72FF; --violet-ink: #B8A6FF; --violet-soft: rgba(142, 114, 255, .16); --lavender: #CFC3FF; --blue: #8FB8FF;
  --shadow: 0 24px 60px -28px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .04) inset;
  --c-training: #9A82FF; --c-observation: #CDBDFF; --c-office: #8FB8FF; --c-off: #7F7A99; --c-leave: #F2B79B; --c-other: #A3ABC6;
  color-scheme: dark;
}
:root[data-td="light"] {
  --bg: #F4F2FB; --bg-2: #ECE8F8;
  --atmos-1: rgba(124, 92, 255, .16); --atmos-2: rgba(127, 178, 255, .14); --atmos-3: rgba(244, 191, 166, .10);
  --glass: rgba(255, 255, 255, .64); --glass-strong: rgba(255, 255, 255, .86); --glass-soft: rgba(255, 255, 255, .42);
  --line: rgba(40, 24, 110, .10); --line-strong: rgba(40, 24, 110, .18); --highlight: rgba(255, 255, 255, .9);
  --ink: #17132E; --ink-2: #544C74; --ink-3: #857DA6;
  --violet: #5B3FE0; --violet-ink: #4A2FC9; --violet-soft: rgba(91, 63, 224, .10); --lavender: #7D66E8; --blue: #3E78D6;
  --shadow: 0 18px 50px -24px rgba(44, 26, 120, .35), 0 2px 6px rgba(44, 26, 120, .06);
  --c-training: #6A4CF0; --c-observation: #9B7CF5; --c-office: #3E78D6; --c-off: #8C87A3; --c-leave: #D9825E; --c-other: #6E7896;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: -20vh -20vw; z-index: -1; pointer-events: none;
  background:
    radial-gradient(42vmax 34vmax at 12% 4%, var(--atmos-1), transparent 70%),
    radial-gradient(38vmax 30vmax at 96% 26%, var(--atmos-2), transparent 70%),
    radial-gradient(44vmax 36vmax at 60% 108%, var(--atmos-3), transparent 70%),
    linear-gradient(180deg, var(--bg), var(--bg-2));
}
.display, h1, h2, .num { font-family: "Sora", "Instrument Sans", system-ui, sans-serif; }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--violet-ink); }
.nav-item, .me, .icon-btn, .btn, .change-banner, a.row-card { text-decoration: none; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.hide { display: none !important; }

/* glass */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(140%); backdrop-filter: blur(22px) saturate(140%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow), inset 0 1px 0 var(--highlight);
}
.panel { border-radius: 22px; padding: 18px; }
.panel + .panel { margin-top: 14px; }

/* ---------- layout ---------- */
.app { display: flex; min-height: 100dvh; }
.side { display: none; }
.main { flex: 1; min-width: 0; padding: 12px 16px 120px; }
.wrap { max-width: 640px; margin: 0 auto; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 4px 2px 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 34px; height: 34px; border-radius: 10px; }
.brand b { font: 600 15px/1.1 "Sora", sans-serif; letter-spacing: -.01em; display: block; }
.brand span { font-size: 11.5px; color: var(--ink-3); display: block; }
.topbar .spacer { flex: 1; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { background: var(--violet-soft); color: var(--ink); }
.icon-btn svg { width: 21px; height: 21px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 600 13px "Sora", sans-serif; color: #fff; background: linear-gradient(140deg, #9C82FF, #5A3BE0); box-shadow: 0 0 0 2px var(--line-strong); }

/* bottom nav */
.bottom-nav {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom));
  width: min(440px, calc(100% - 24px)); z-index: 30; border-radius: 26px; padding: 7px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  background: var(--glass-strong);
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 7px; border-radius: 19px; color: var(--ink-3); font-size: 11.5px; font-weight: 500; min-height: 54px; transition: background .25s, color .25s; }
.nav-item svg { width: 22px; height: 22px; }
.nav-item[aria-current="page"] { color: var(--ink); background: var(--violet-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--violet) 30%, transparent), 0 6px 22px -10px var(--violet); }
.nav-item[aria-current="page"] svg { color: var(--violet-ink); }

/* status chip */
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-3); }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.status.ok i { background: #58C79A; }
.status.busy i { background: var(--violet); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- Today ---------- */
.greet { padding: 10px 2px 16px; }
.greet .hello { font-size: 14px; color: var(--ink-2); }
.greet .dateline { display: flex; align-items: baseline; gap: 12px; margin-top: 4px; }
.greet .big { font: 300 64px/0.9 "Sora", sans-serif; letter-spacing: -.04em; }
.greet .dow { font: 500 20px/1.15 "Sora", sans-serif; letter-spacing: -.01em; }
.greet .mon { font-size: 15px; color: var(--ink-2); }

.today-card { position: relative; overflow: hidden; border-radius: 28px; padding: 22px 22px 20px; cursor: pointer; transition: transform .25s ease, box-shadow .25s ease; text-align: left; width: 100%; display: block; }
.today-card::after { content: ""; position: absolute; inset: auto -30% -60% 30%; height: 90%; background: radial-gradient(closest-side, color-mix(in srgb, var(--cat, var(--violet)) 30%, transparent), transparent); pointer-events: none; }
.today-card .horizon { position: absolute; inset: 0; pointer-events: none; }
.today-card .horizon path { fill: none; stroke: color-mix(in srgb, var(--cat, var(--violet)) 55%, transparent); stroke-width: 1.2; }
.today-card .horizon circle { fill: var(--lavender); filter: drop-shadow(0 0 6px var(--violet)); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; }
.label { font: 500 13px "Instrument Sans", sans-serif; color: var(--ink-2); }
.duty-title { position: relative; font: 500 clamp(26px, 7.4vw, 38px)/1.08 "Sora", sans-serif; letter-spacing: -.025em; margin: 14px 0 6px; overflow-wrap: anywhere; }
.duty-title.long { font-size: clamp(22px, 5.6vw, 30px); }
.meaning { position: relative; color: var(--ink-2); font-size: 15px; }
.facts { position: relative; display: grid; gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.fact { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 14.5px; }
.fact svg { width: 18px; height: 18px; color: var(--ink-3); margin-top: 2px; }
.fact small { display: block; color: var(--ink-3); font-size: 12px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 99px; font-size: 12px; font-weight: 500; color: var(--ink-2); background: var(--glass-soft); border: 1px solid var(--line); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 3px; background: var(--c, var(--c-other)); }
.tag { display: inline-flex; padding: 2px 8px; border-radius: 8px; font-size: 11.5px; font-weight: 500; color: var(--violet-ink); background: var(--violet-soft); }

.row-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border-radius: 20px; padding: 14px 16px; margin-top: 12px; transition: transform .2s; }
.row-card .when { width: 72px; flex: none; }
.row-card .when b { display: block; font: 500 13px "Instrument Sans", sans-serif; color: var(--ink-2); }
.row-card .what { flex: 1; min-width: 0; font: 500 18px/1.25 "Sora", sans-serif; letter-spacing: -.01em; overflow-wrap: anywhere; }
.row-card .what small { display: block; font: 400 13px "Instrument Sans", sans-serif; color: var(--ink-3); margin-top: 2px; letter-spacing: 0; }
.chev { width: 18px; height: 18px; color: var(--ink-3); flex: none; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 26px 2px 8px; }
.section-head h2 { font: 500 17px "Sora", sans-serif; letter-spacing: -.01em; }
.link-btn { color: var(--violet-ink); font-weight: 500; font-size: 14px; padding: 8px 4px; border-radius: 8px; }
.link-btn:hover { text-decoration: underline; }

.board { border-radius: 22px; padding: 4px 0; overflow: hidden; }
.board-row { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 16px; min-height: 56px; border-top: 1px solid var(--line); }
.board-row:first-child { border-top: 0; }
.board-row:hover { background: var(--violet-soft); }
.board-row .d { font: 500 15px/1.1 "Sora", sans-serif; letter-spacing: -.01em; }
.board-row .d small { display: block; font: 500 11.5px "Instrument Sans", sans-serif; color: var(--ink-3); margin-top: 2px; }
.board-row .v { display: flex; align-items: center; gap: 10px; min-width: 0; }
.board-row .v span { overflow-wrap: anywhere; font-weight: 500; }
.bar { width: 4px; align-self: stretch; min-height: 22px; border-radius: 3px; background: var(--c, var(--c-other)); flex: none; }
.board-row.past { opacity: .55; }

.foot-info { margin: 28px 2px 0; font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 14px; }

/* ---------- category colours ---------- */
.cat-training { --c: var(--c-training); --cat: var(--c-training); }
.cat-observation { --c: var(--c-observation); --cat: var(--c-observation); }
.cat-office { --c: var(--c-office); --cat: var(--c-office); }
.cat-off { --c: var(--c-off); --cat: var(--c-off); }
.cat-leave { --c: var(--c-leave); --cat: var(--c-leave); }
.cat-other { --c: var(--c-other); --cat: var(--c-other); }

/* ---------- page header ---------- */
.page-head { padding: 8px 2px 16px; }
.page-head h1 { font: 500 30px/1.1 "Sora", sans-serif; letter-spacing: -.03em; }
.page-head p { color: var(--ink-2); margin-top: 6px; }
.viewing { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

/* inputs */
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; height: 50px; border-radius: 16px; padding: 0 16px 0 44px; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); outline: none; font-size: 16px; }
.search input:focus { border-color: color-mix(in srgb, var(--violet) 60%, transparent); box-shadow: 0 0 0 4px var(--violet-soft); }
.seg { display: inline-flex; padding: 4px; border-radius: 14px; gap: 2px; background: var(--glass-soft); border: 1px solid var(--line); }
.seg button { padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--ink-2); min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--ink); box-shadow: 0 2px 10px -4px rgba(0, 0, 0, .3), inset 0 0 0 1px var(--line); }
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; margin: 12px -2px 0; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fbtn { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; font-size: 13px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--line); background: var(--glass-soft); min-height: 36px; }
.fbtn i { width: 8px; height: 8px; border-radius: 3px; background: var(--c); }
.fbtn[aria-pressed="true"] { color: var(--ink); border-color: color-mix(in srgb, var(--violet) 55%, transparent); background: var(--violet-soft); }
.fbtn .n { color: var(--ink-3); font-weight: 400; }
select.sel, input.sel { height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); padding: 0 12px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 14px; font-weight: 600; font-size: 15px; border: 1px solid var(--line); background: var(--glass); }
.btn.primary { color: #fff; border-color: transparent; background: linear-gradient(135deg, #8A6CFF, #5A3BE0); box-shadow: 0 10px 30px -12px #6A48F0, inset 0 1px 0 rgba(255, 255, 255, .25); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }

/* ---------- date nav ---------- */
.date-nav { display: flex; align-items: center; gap: 8px; }
.date-nav .title { flex: 1; min-width: 0; text-align: center; }
.date-nav .title b { display: block; font: 500 20px/1.2 "Sora", sans-serif; letter-spacing: -.02em; }
.date-nav .title span { font-size: 13px; color: var(--ink-3); }
.round { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--glass); color: var(--ink-2); flex: none; }
.round:hover { color: var(--ink); border-color: var(--line-strong); }
.round:disabled { opacity: .35; cursor: default; }
.round svg { width: 18px; height: 18px; }

/* ---------- lists ---------- */
.list { border-radius: 22px; overflow: hidden; margin-top: 14px; }
.li { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 16px; min-height: 60px; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
button.li:hover { background: var(--violet-soft); }
.li .body { flex: 1; min-width: 0; }
.li .name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.li .sub { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.li .sub.duty { color: var(--ink); font-weight: 500; }
.li.dim { opacity: .55; }
.list-label { font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 18px 4px 0; }
.initials { width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center; font: 600 13px "Sora", sans-serif; color: var(--ink-2); background: var(--glass-soft); border: 1px solid var(--line); }
.li[aria-pressed="true"] { background: var(--violet-soft); }
.li[aria-pressed="true"] .initials { background: linear-gradient(140deg, #9C82FF, #5A3BE0); color: #fff; border-color: transparent; }
.qual { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 6px; border-radius: 8px; font-size: 12.5px; font-weight: 600; background: var(--violet-soft); color: var(--violet-ink); }
.qual svg { width: 13px; height: 13px; }
mark { background: color-mix(in srgb, var(--violet) 28%, transparent); color: inherit; border-radius: 3px; padding: 0; }

/* ---------- calendar ---------- */
.cal { border-radius: 24px; padding: 14px 10px 12px; }
.cal-head { display: flex; align-items: center; gap: 8px; padding: 0 4px 12px; }
.cal-head h2 { flex: 1; font: 500 20px "Sora", sans-serif; letter-spacing: -.02em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { text-align: center; font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding-bottom: 4px; }
.cal-day { position: relative; min-height: 70px; border-radius: 12px; padding: 6px 5px 6px 7px; text-align: left; display: flex; flex-direction: column; gap: 3px; background: var(--glass-soft); border: 1px solid transparent; overflow: hidden; }
.cal-day::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c, transparent); }
.cal-day .n { font: 500 13px "Sora", sans-serif; color: var(--ink-2); }
.cal-day .l { font-size: 10.5px; line-height: 1.2; font-weight: 600; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.cal-day.cat-off .l, .cal-day.cat-off .n { color: var(--ink-3); }
.cal-day.out { visibility: hidden; }
.cal-day.nodata { opacity: .4; }
.cal-day.today { border-color: color-mix(in srgb, var(--violet) 70%, transparent); }
.cal-day.today .n { color: var(--violet-ink); font-weight: 700; }
.cal-day[aria-pressed="true"] { background: var(--violet-soft); border-color: var(--violet); box-shadow: 0 0 22px -8px var(--violet); }
.cal-day:hover { border-color: var(--line-strong); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 12px; padding: 0 4px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.cal-anim { animation: calIn .28s ease; }
@keyframes calIn { from { opacity: 0; transform: translateX(var(--dx, 8px)); } }

.mini .cal-day { min-height: 36px; padding: 4px; align-items: center; justify-content: center; }
.mini .cal-day::before { left: 50%; top: auto; bottom: 4px; width: 14px; height: 3px; transform: translateX(-50%); border-radius: 3px; }
.mini .cal-day .n { font-size: 12.5px; }
.mini .cal-day .l { display: none; }
.mini .cal-head h2 { font-size: 16px; }

/* ---------- sheet / modal ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(8, 6, 24, .45); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet { width: 100%; max-width: 560px; max-height: 88dvh; overflow: auto; border-radius: 28px 28px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); background: var(--glass-strong); animation: up .28s cubic-bezier(.2, .8, .2, 1); overscroll-behavior: contain; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 0 auto 14px; }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; }
.sheet-head .t { flex: 1; min-width: 0; }

.ob-steps li { display: flex; gap: 14px; align-items: flex-start; }
.ob-steps li > span { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; font: 600 14px "Sora", sans-serif; color: var(--violet-ink); background: var(--violet-soft); }
.ob-steps b { display: block; font-size: 15px; font-weight: 600; }
.ob-steps small { display: block; font-size: 13.5px; color: var(--ink-2); margin-top: 1px; }
@media (min-width: 960px) { .ob-steps { grid-column: 1; margin-top: 36px; } }
.btn.danger { color: var(--c-leave); border-color: color-mix(in srgb, var(--c-leave) 40%, transparent); }
.first-run .first-card { padding: 4px 0; }
.first-run .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.first-run .stat { padding: 12px; }
.first-run .stat b { font-size: 24px; }

/* ---------- toasts ---------- */
.toast { position: fixed; z-index: 90; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); width: min(420px, calc(100% - 24px));
  display: flex; align-items: center; gap: 12px; padding: 12px 16px 14px 12px; border-radius: 20px; overflow: hidden; cursor: pointer;
  background: var(--glass-strong); box-shadow: var(--shadow), inset 0 0 0 1px var(--line-strong);
  transform: translateX(-50%); animation: toastIn .5s cubic-bezier(.2,1.3,.35,1) both; }
.toast.out { animation: toastOut .26s ease-in both; }
.toast .t-ic { flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(140deg, #9C82FF, #5A3BE0); box-shadow: 0 8px 20px -8px #6A48F0; }
.toast .t-ic svg { width: 18px; height: 18px; }
.toast.t-info .t-ic { background: linear-gradient(140deg, #8FB8FF, #4C74D6); box-shadow: 0 8px 20px -8px #4C74D6; }
.toast.t-error .t-ic { background: linear-gradient(140deg, #F6B08F, #D9654A); box-shadow: 0 8px 20px -8px #D9654A; }
.toast .t-body { flex: 1; min-width: 0; }
.toast .t-body b { display: block; font-size: 15px; font-weight: 600; color: var(--ink); }
.toast .t-body small { display: block; margin-top: 1px; font-size: 13px; color: var(--ink-2); }
.toast .t-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; transform-origin: left; background: linear-gradient(90deg, #9C82FF, #8FB8FF); opacity: .8; animation: toastBar linear both; }
.toast.t-error .t-bar { background: linear-gradient(90deg, #F6B08F, #D9654A); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 18px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 12px) scale(.97); } }
@keyframes toastBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@media (min-width: 768px) { .toast { left: auto; right: 24px; bottom: 24px; transform: none; animation-name: toastInD; } .toast.out { animation-name: toastOutD; } }
@keyframes toastInD { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastOutD { to { opacity: 0; transform: translateY(10px) scale(.97); } }

/* ---------- celebration ---------- */
.celebrate { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: 20px;
  background: radial-gradient(60vmax 50vmax at 50% 45%, rgba(124, 92, 255, .28), rgba(8, 6, 24, .62));
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fade .25s ease both; }
.celebrate.out { animation: fadeOut .22s ease both; }
.cele-card { width: min(380px, 100%); border-radius: 30px; padding: 30px 22px 20px; text-align: center; background: var(--glass-strong);
  box-shadow: 0 40px 90px -30px rgba(40, 20, 120, .7), inset 0 0 0 1px var(--line-strong); animation: celeIn .6s cubic-bezier(.2,1.25,.35,1) both; }
.celebrate.out .cele-card { animation: celeOut .22s ease-in both; }
.cele-badge { position: relative; width: 96px; height: 96px; margin: 0 auto 18px; }
.cele-badge .cele-disc { position: relative; display: block; width: 96px; height: 96px; border-radius: 50%; overflow: hidden; isolation: isolate;
  background: radial-gradient(circle at 35% 30%, #A68CFF, #5A3BE0 70%); box-shadow: 0 18px 40px -12px rgba(106, 72, 240, .9); }
.cele-badge .cele-disc::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); pointer-events: none; }
.cele-badge svg { display: block; width: 96px; height: 96px; background: none; }
.cele-badge .ring { fill: none; stroke: rgba(255,255,255,.35); stroke-width: 2.5; stroke-dasharray: 214; stroke-dashoffset: 214; transform: rotate(-90deg); transform-origin: 40px 40px; animation: draw .7s .15s cubic-bezier(.6,0,.2,1) forwards; }
.cele-badge .tick { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 44; stroke-dashoffset: 44; animation: draw .45s .5s cubic-bezier(.6,0,.2,1) forwards; }
.cele-badge .sparks { position: absolute; inset: 0; }
.cele-badge .sparks i { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; opacity: 0;
  background: var(--lavender); box-shadow: 0 0 10px var(--violet); transform: rotate(var(--a)) translateY(0);
  animation: spark .9s calc(.45s + var(--d)) cubic-bezier(.1,.8,.3,1) forwards; }
.cele-badge .sparks i:nth-child(3n) { background: #F6C9AE; box-shadow: 0 0 10px #F6C9AE; width: 5px; height: 5px; }
.cele-badge .sparks i:nth-child(3n+1) { background: #8FB8FF; box-shadow: 0 0 10px #8FB8FF; }
.cele-card h2 { font: 500 28px/1.1 "Sora", sans-serif; letter-spacing: -.03em; margin: 0; animation: rise .5s .35s ease both; }
.cele-sub { margin: 8px 6px 0; color: var(--ink-2); font-size: 15px; line-height: 1.45; animation: rise .5s .42s ease both; }
.cele-sub b { color: var(--ink); }
.cele-facts { display: grid; grid-template-columns: auto auto 1fr; gap: 8px; margin-top: 18px; animation: rise .5s .5s ease both; }
.cele-facts span { display: flex; flex-direction: column; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: var(--glass-soft); box-shadow: inset 0 0 0 1px var(--line); text-align: left; min-width: 0; }
.cele-facts b { font: 500 16px/1.2 "Sora", sans-serif; letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
.cele-facts span:last-child b { font-size: 13.5px; white-space: normal; }
.cele-facts small { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.cele-actions { display: grid; gap: 8px; margin-top: 20px; animation: rise .5s .58s ease both; }
.cele-actions .btn { min-height: 50px; font-size: 16px; }
.cele-actions .btn:not(.primary) { background: transparent; }
@keyframes celeIn { from { opacity: 0; transform: translateY(24px) scale(.92); } to { opacity: 1; transform: none; } }
@keyframes celeOut { to { opacity: 0; transform: scale(.96); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes spark { 0% { opacity: 0; transform: rotate(var(--a)) translateY(0) scale(.4); } 25% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-66px) scale(1); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadeOut { to { opacity: 0; } }

/* ---------- confirm sheet ---------- */
.confirm { text-align: center; padding: 8px 4px 0; }
.confirm-ic { display: grid; place-items: center; width: 56px; height: 56px; margin: 4px auto 14px; border-radius: 18px; color: var(--violet-ink); background: var(--violet-soft); }
.confirm-ic.danger { color: var(--c-leave); background: color-mix(in srgb, var(--c-leave) 16%, transparent); }
.confirm-ic svg { width: 26px; height: 26px; }
.confirm h2 { font-size: 22px; }
.confirm p { margin: 8px 8px 0; line-height: 1.5; }
.confirm-actions { display: grid; gap: 8px; margin-top: 20px; }
.confirm-actions .btn { min-height: 50px; font-size: 16px; }
.btn.danger-fill { color: #fff; border-color: transparent; background: linear-gradient(135deg, #EE8C6C, #C9553C); box-shadow: 0 10px 28px -12px #C9553C; }

/* unlock */
.lock-card.unlocked { animation: unlockOut .32s ease-in forwards; }
@keyframes unlockOut { to { opacity: 0; transform: translateY(-10px) scale(.98); } }

@media (prefers-reduced-motion: reduce) {
  .toast, .toast.out, .celebrate, .cele-card, .cele-card *, .cele-badge *, .lock-card.unlocked { animation-duration: .01ms !important; animation-delay: 0s !important; }
  .cele-badge .ring, .cele-badge .tick { stroke-dashoffset: 0; }
}

<script>
/* =====================================================================
   TrainerDuties core
   1. XLSX reader   – zip + SpreadsheetML → neutral grid (no library)
   2. Parser        – grid → normalised roster model (no cell addresses
                      are hardcoded; structure is found from labels)
   3. Interpreter   – original duty value → category / batch / time
   4. Diff          – roster version comparison (Trainer + Date)
   ===================================================================== */
const TD = (() => {
  'use strict';

  /* ---------------- 1. XLSX reader ---------------- */
  const td8 = new TextDecoder('utf-8');

  async function unzip(buf) {
    const dv = new DataView(buf);
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw userError('This file is not an Excel workbook (.xlsx / .xlsm).', 'No zip directory found.');
    const count = dv.getUint16(eocd + 10, true);
    let off = dv.getUint32(eocd + 16, true);
    const entries = {};
    for (let n = 0; n < count; n++) {
      if (dv.getUint32(off, true) !== 0x02014b50) throw userError('The workbook file appears to be damaged.', 'Bad central directory entry.');
      const flags = dv.getUint16(off + 8, true);
      const method = dv.getUint16(off + 10, true);
      const csize = dv.getUint32(off + 20, true);
      const nlen = dv.getUint16(off + 28, true), elen = dv.getUint16(off + 30, true), clen = dv.getUint16(off + 32, true);
      const lho = dv.getUint32(off + 42, true);
      const name = td8.decode(new Uint8Array(buf, off + 46, nlen));
      entries[name] = { method, csize, lho, encrypted: !!(flags & 1) };
      off += 46 + nlen + elen + clen;
    }
    return {
      names: Object.keys(entries),
      async text(name) {
        const e = entries[name];
        if (!e) return null;
        if (e.encrypted) throw userError('This workbook is password-protected.', 'Encrypted zip entry: ' + name);
        const lnl = dv.getUint16(e.lho + 26, true), lel = dv.getUint16(e.lho + 28, true);
        const data = new Uint8Array(buf, e.lho + 30 + lnl + lel, e.csize);
        let bytes;
        if (e.method === 0) bytes = data;
        else if (e.method === 8) {
          const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
          bytes = new Uint8Array(await new Response(stream).arrayBuffer());
        } else throw userError('This workbook uses an unsupported compression format.', 'Zip method ' + e.method);
        return td8.decode(bytes);
      }
    };
  }

  function userError(message, detail) { const e = new Error(message); e.userMessage = message; e.detail = detail; return e; }

  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const els = (node, tag) => Array.from(node.getElementsByTagNameNS('*', tag));
  const kid = (node, tag) => { for (const c of node.children) if (c.localName === tag) return c; return null; };

  function colIndex(letters) { let n = 0; for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }
  function colLetters(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  function parseRef(ref) { const m = /^\$?([A-Z]+)\$?(\d+)$/.exec(ref); return m ? { c: colIndex(m[1]), r: +m[2] } : null; }
  const addr = (r, c) => colLetters(c) + r;

  function resolvePath(base, target) {
    if (target.startsWith('/')) return target.slice(1);
    const parts = base.split('/'); parts.pop();
    for (const seg of target.split('/')) { if (seg === '..') parts.pop(); else if (seg !== '.') parts.push(seg); }
    return parts.join('/');
  }
  async function rels(zip, partPath) {
    const p = partPath.split('/'); const file = p.pop();
    const txt = await zip.text([...p, '_rels', file + '.rels'].join('/'));
    const out = [];
    if (!txt) return out;
    for (const r of els(xml(txt), 'Relationship')) out.push({ id: r.getAttribute('Id'), type: r.getAttribute('Type') || '', target: resolvePath(partPath, r.getAttribute('Target') || '') });
    return out;
  }

  const BUILTIN_DATE_FMTS = new Set([14, 15, 16, 17, 22, 27, 30, 36, 45, 46, 47, 50, 57]);
  function excelDate(serial) {
    const ms = Math.round((serial - 25569) * 86400000);
    const d = new Date(ms);
    return d.toISOString().slice(0, 10);
  }

  async function readWorkbook(buf, filename) {
    const zip = await unzip(buf);
    const wbPath = zip.names.find(n => /^xl\/workbook\d*\.xml$/i.test(n));
    if (!wbPath) throw userError('This file does not look like an Excel workbook.', 'xl/workbook.xml missing');
    const wbDoc = xml(await zip.text(wbPath));
    const wbRels = await rels(zip, wbPath);
    const relById = Object.fromEntries(wbRels.map(r => [r.id, r]));

    // shared strings
    let shared = [];
    const ssRel = wbRels.find(r => /sharedStrings$/.test(r.type));
    if (ssRel) {
      const ssDoc = xml(await zip.text(ssRel.target));
      shared = els(ssDoc, 'si').map(si => {
        let s = '';
        for (const t of els(si, 't')) { if (t.parentNode && t.parentNode.localName === 'rPh') continue; if (t.parentNode && t.parentNode.parentNode && t.parentNode.parentNode.localName === 'rPh') continue; s += t.textContent; }
        return s;
      });
    }
    // styles: which xf indexes are dates
    const dateXf = new Set();
    const leftXf = new Set(); // cells filled with theme colour "White, Background 1" darkened (grey) = trainer no longer in the company
    const stRel = wbRels.find(r => /\/styles$/.test(r.type));
    if (stRel) {
      const st = xml(await zip.text(stRel.target));
      const fillsEl = els(st, 'fills')[0];
      const leftFill = fillsEl ? Array.from(fillsEl.children).map(f => {
        const pf = kid(f, 'patternFill'); if (!pf || (pf.getAttribute('patternType') || 'none') === 'none') return false;
        const fg = kid(pf, 'fgColor'); if (!fg) return false;
        return fg.getAttribute('theme') === '0' && parseFloat(fg.getAttribute('tint') || '0') <= -0.45; // "White, Background 1, Darker 50%"
      }) : [];
      const custom = {};
      for (const nf of els(st, 'numFmt')) custom[+nf.getAttribute('numFmtId')] = nf.getAttribute('formatCode') || '';
      const cellXfs = els(st, 'cellXfs')[0];
      if (cellXfs) Array.from(cellXfs.children).forEach((xf, i) => {
        if (leftFill[+(xf.getAttribute('fillId') || 0)]) leftXf.add(i);
        const id = +xf.getAttribute('numFmtId');
        const code = (custom[id] || '').replace(/"[^"]*"|\[[^\]]*\]/g, '');
        if (BUILTIN_DATE_FMTS.has(id) || (/[dy]/i.test(code) && !/^[#0.,%\s]*$/.test(code))) dateXf.add(i);
      });
    }
    // modified date
    let modified = null;
    const core = await zip.text('docProps/core.xml');
    if (core) { const m = els(xml(core), 'modified')[0]; if (m) modified = m.textContent; }

    const sheets = [];
    const sheetEls = els(wbDoc, 'sheet');
    for (const sh of sheetEls) {
      const rid = sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id') || sh.getAttribute('r:id');
      const rel = relById[rid];
      if (!rel || !/worksheet$/.test(rel.type)) continue;
      const txt = await zip.text(rel.target);
      if (!txt) continue;
      const doc = xml(txt);
      const cells = new Map(); // "r,c" -> {v, date}
      const leftCells = new Set(); // "r,c" of grey (White darker) cells, empty or not
      let maxR = 0, maxC = 0;
      const hiddenRows = new Set(), hiddenCols = new Set();
      for (const row of els(doc, 'row')) {
        const r = +row.getAttribute('r');
        if (row.getAttribute('hidden') === '1' || row.getAttribute('hidden') === 'true') hiddenRows.add(r);
        for (const c of row.children) {
          if (c.localName !== 'c') continue;
          const ref = parseRef(c.getAttribute('r') || '');
          if (!ref) continue;
          if (leftXf.has(+(c.getAttribute('s') || 0))) leftCells.add(ref.r + ',' + ref.c);
          const t = c.getAttribute('t') || 'n';
          const vEl = kid(c, 'v');
          let v = null, date = null;
          if (t === 's') v = vEl ? shared[+vEl.textContent] ?? '' : null;
          else if (t === 'inlineStr') { const is = kid(c, 'is'); v = is ? els(is, 't').map(x => x.textContent).join('') : null; }
          else if (t === 'str') v = vEl ? vEl.textContent : null;
          else if (t === 'b') v = vEl ? (vEl.textContent === '1') : null;
          else if (t === 'e') v = null;
          else if (t === 'd') { v = vEl ? vEl.textContent : null; date = v ? v.slice(0, 10) : null; }
          else if (vEl) {
            v = +vEl.textContent;
            const s = +(c.getAttribute('s') || 0);
            if (dateXf.has(s) && v > 59 && v < 80000) date = excelDate(v);
          }
          if (v === null || v === '') continue;
          cells.set(ref.r + ',' + ref.c, { v, date });
          if (ref.r > maxR) maxR = ref.r;
          if (ref.c > maxC) maxC = ref.c;
        }
      }
      for (const col of els(doc, 'col')) {
        if (col.getAttribute('hidden') === '1' || col.getAttribute('hidden') === 'true') {
          for (let i = +col.getAttribute('min'); i <= +col.getAttribute('max'); i++) hiddenCols.add(i);
        }
      }
      const merges = [];
      for (const mc of els(doc, 'mergeCell')) {
        const [a, b] = (mc.getAttribute('ref') || '').split(':');
        const s = parseRef(a || ''), e = parseRef(b || a || '');
        if (s && e) merges.push({ s, e });
      }
      // fill merged ranges from their anchor
      for (const m of merges) {
        const anchor = cells.get(m.s.r + ',' + m.s.c);
        if (!anchor) continue;
        for (let r = m.s.r; r <= m.e.r; r++) for (let c = m.s.c; c <= m.e.c; c++) {
          if (!cells.has(r + ',' + c)) cells.set(r + ',' + c, { ...anchor, merged: true });
        }
      }
      // comments
      const comments = new Map();
      const sRels = await rels(zip, rel.target);
      const cRel = sRels.find(x => /\/comments$/.test(x.type));
      if (cRel) {
        const ctxt = await zip.text(cRel.target);
        if (ctxt) for (const cm of els(xml(ctxt), 'comment')) {
          const ref = parseRef(cm.getAttribute('ref') || '');
          if (!ref) continue;
          const text = cleanComment(els(cm, 't').map(t => t.textContent).join(''));
          if (text) comments.set(ref.r + ',' + ref.c, text);
        }
      }
      const state = sh.getAttribute('state') || 'visible';
      sheets.push({ name: sh.getAttribute('name') || 'Sheet', hidden: state !== 'visible', cells, leftCells, maxR, maxC, hiddenRows, hiddenCols, comments });
    }
    return { filename: filename || 'workbook.xlsx', sizeBytes: buf.byteLength, modified, sheets };
  }

  function cleanComment(t) {
    let s = t.replace(/\r/g, '');
    if (/\[Threaded comment\]/i.test(s)) {
      const i = s.search(/\n\s*Comment:\s*\n/i);
      if (i >= 0) s = s.slice(i).replace(/^\s*Comment:\s*/i, '');
    }
    return s.split('\n').map(l => l.trim()).filter(Boolean).join('\n').trim();
  }

  /* ---------------- helpers ---------------- */
  const MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
  const WEEKDAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  function monthFrom(text) {
    const s = String(text).trim().toLowerCase().split(/[\s\-_]+/)[0].replace(/\.$/, '');
    if (s.length < 3 || !/^[a-z]+$/.test(s)) return -1;
    return MONTHS.findIndex(m => m.startsWith(s));
  }
  function monthInText(text) {
    const m = /\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\b/i.exec(String(text));
    return m ? MONTHS.findIndex(x => x.startsWith(m[1].toLowerCase().slice(0, 3))) : -1;
  }
  function weekdayFrom(text) {
    const s = String(text).trim().toLowerCase();
    if (s.length < 2 || s.length > 9) return -1;
    return WEEKDAYS.findIndex(w => s.startsWith(w) || (s.length >= 3 && w.startsWith(s.slice(0, 3))));
  }
  const pad = n => String(n).padStart(2, '0');
  const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const daysIn = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const weekdayOf = (y, m, d) => new Date(Date.UTC(y, m, d)).getUTCDay();
  const fmtShort = isoStr => { const [y, m, d] = isoStr.split('-').map(Number); return `${d} ${MONTHS[m - 1].slice(0, 3).replace(/^./, c => c.toUpperCase())} ${y}`; };
  const txt = v => (v === null || v === undefined) ? '' : String(v);
  const clean = v => txt(v).replace(/\s+/g, ' ').trim();
  function nameKey(name) { return clean(name).replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase(); }
  function nameParts(name) {
    const tags = []; let m; const re = /\(([^)]*)\)/g;
    while ((m = re.exec(name))) if (m[1].trim()) tags.push(m[1].trim());
    return { display: clean(name).replace(/\s*\([^)]*\)\s*/g, ' ').replace(/\s+/g, ' ').trim(), tags };
  }
  const SHIFT_RE = /^(.*?)[\s\-–:]*\(?(\d{1,2}:?\d{2})\s*[-–]\s*(\d{1,2}:?\d{2})\)?\s*$/;
  function fmtTime(t) { const s = t.replace(':', ''); const hh = s.length === 3 ? '0' + s[0] : s.slice(0, 2); const mm = s.slice(-2); return `${hh}:${mm}`; }

  /* ---------------- 2. Parser ---------------- */
  function parseWorkbook(wb, progress = () => {}) {
    const warnings = [];
    const info = [];
    const sheetsRead = [], sheetsSkipped = [];
    const legend = {};
    const shifts = {};
    const trainerMap = new Map();
    const entries = [];
    const covered = new Set();
    const warn = (w) => warnings.push(w);

    progress('Identifying Trainers…');
    // year hints across workbook
    const yearOf = s => { const m = /(20\d{2})/.exec(s); return m ? +m[1] : null; };

    wb.sheets.forEach((sh, sheetOrder) => {
      const get = (r, c) => sh.cells.get(r + ',' + c);
      const val = (r, c) => { const x = get(r, c); return x ? x.v : null; };
      const s = (r, c) => clean(val(r, c));

      if (sh.hidden) { sheetsSkipped.push({ name: sh.name, reason: 'Hidden sheet (treated as archived)' }); return; }

      // header row: a cell reading "Name"
      let hr = -1, nameCol = -1;
      for (let r = 1; r <= Math.min(sh.maxR, 20) && hr < 0; r++) for (let c = 1; c <= Math.min(sh.maxC, 12); c++) {
        if (/^(trainer\s*)?names?$/i.test(s(r, c)) || /^trainer$/i.test(s(r, c))) { hr = r; nameCol = c; break; }
      }
      if (hr < 0) { sheetsSkipped.push({ name: sh.name, reason: 'No “Name” column found — not a roster sheet' }); return; }

      // locate day-number row near header (same row, or ±2)
      const dayRowScore = r => {
        let n = 0; for (let c = nameCol + 1; c <= sh.maxC; c++) { const x = get(r, c); if (x && (x.date || (typeof x.v === 'number' && x.v >= 1 && x.v <= 31 && Number.isInteger(x.v)) || (/^\d{1,2}$/.test(clean(x.v)) && +clean(x.v) <= 31))) n++; }
        return n;
      };
      let dayRow = -1, best = 0;
      for (const r of [hr, hr + 1, hr - 1, hr + 2, hr - 2]) { if (r < 1) continue; const sc = dayRowScore(r); if (sc > best) { best = sc; dayRow = r; } }
      if (best < 7) { sheetsSkipped.push({ name: sh.name, reason: 'No row of day numbers found next to the Name header' }); return; }

      // other columns
      let siCol = -1, qualCol = -1;
      for (const r of [hr, hr - 1, hr + 1]) for (let c = 1; c <= Math.min(sh.maxC, nameCol + 4); c++) {
        const t = s(r, c);
        if (siCol < 0 && c < nameCol && /^(si|s\/?n|sl|no\.?|#|nr)$/i.test(t)) siCol = c;
        if (qualCol < 0 && c !== nameCol && /qua?l?i?fi?cation|qualif/i.test(t)) qualCol = c;
      }
      if (siCol < 0 && nameCol > 1) siCol = nameCol - 1;
      const firstDataCol = Math.max(nameCol, qualCol) + 1;
      const shiftCol = siCol > 1 ? siCol - 1 : -1;

      // weekday row and month row
      const wdRow = [dayRow + 1, dayRow - 1, hr + 1].find(r => { let n = 0; for (let c = firstDataCol; c <= Math.min(sh.maxC, firstDataCol + 10); c++) if (weekdayFrom(s(r, c)) >= 0) n++; return n >= 5; }) || -1;
      let monthRow = -1;
      for (let r = 1; r < dayRow; r++) { if (r === wdRow) continue; let n = 0; for (let c = firstDataCol; c <= Math.min(sh.maxC, firstDataCol + 40); c++) if (monthFrom(s(r, c)) >= 0) n++; if (n >= 3) { monthRow = r; break; } }

      // year: sheet name, shift label, or neighbours
      let year = yearOf(sh.name);
      if (!year) for (let r = 1; r <= Math.min(sh.maxR, 5) && !year; r++) for (let c = 1; c <= firstDataCol; c++) { const y = yearOf(s(r, c)); if (y) { year = y; break; } }
      let baseMonth = monthInText(sh.name);

      // Build date columns
      const dateCols = [];
      let curMonth = -1, curYear = year, lastMonth = -1;
      for (let c = firstDataCol; c <= sh.maxC; c++) {
        const cell = get(dayRow, c);
        if (!cell) continue;
        let dateStr = null;
        if (cell.date) dateStr = cell.date;
        else {
          const day = typeof cell.v === 'number' ? cell.v : (/^\d{1,2}$/.test(clean(cell.v)) ? +clean(cell.v) : NaN);
          if (!Number.isInteger(day) || day < 1 || day > 31) continue;
          let m = monthRow > 0 ? monthFrom(s(monthRow, c)) : -1;
          if (m < 0 && monthRow > 0 && curMonth >= 0) m = curMonth;
          if (m < 0) m = baseMonth;
          if (m < 0 || !curYear) { continue; }
          if (lastMonth >= 0 && m < lastMonth) curYear++;
          lastMonth = m; curMonth = m;
          if (day > daysIn(curYear, m)) { warn({ type: 'header', sheet: sh.name, cell: addr(dayRow, c), message: `Column header reads day ${day}, but ${MONTHS[m].replace(/^./, x => x.toUpperCase())} ${curYear} has only ${daysIn(curYear, m)} days. Column not read.` }); continue; }
          dateStr = iso(curYear, m, day);
          if (wdRow > 0) {
            const wd = weekdayFrom(s(wdRow, c));
            if (wd >= 0 && wd !== weekdayOf(curYear, m, day)) warn({ type: 'header', sheet: sh.name, cell: addr(wdRow, c), date: dateStr, message: `Header shows “${s(wdRow, c)}” for ${fmtShort(dateStr)}, which is a ${['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][weekdayOf(curYear, m, day)]}. The day number was used.` });
          }
        }
        dateCols.push({ c, date: dateStr });
      }
      if (!dateCols.length) {
        sheetsSkipped.push({ name: sh.name, reason: baseMonth < 0 && monthRow < 0 ? 'Couldn’t tell which month this sheet covers (no month in the sheet name or headers)' : 'Couldn’t tell which year this sheet covers' });
        warn({ type: 'sheet', sheet: sh.name, message: `Sheet “${sh.name}” was not read: its month or year couldn’t be determined from the workbook.` });
        return;
      }
      // duplicate dates inside sheet
      const seenDate = new Map();
      for (const dc of dateCols) {
        if (seenDate.has(dc.date)) warn({ type: 'header', sheet: sh.name, cell: addr(dayRow, dc.c), date: dc.date, message: `Two columns are labelled ${fmtShort(dc.date)} (${colLetters(seenDate.get(dc.date))} and ${colLetters(dc.c)}). Values from both are kept.` });
        else seenDate.set(dc.date, dc.c);
        covered.add(dc.date);
      }

      // rows
      const headerBottom = Math.max(hr, dayRow, wdRow);
      let inLegend = false, group = null, trainerRows = 0, cellCount = 0, unnamedRows = 0;
      const sheetShifts = [];
      for (let r = headerBottom + 1; r <= sh.maxR; r++) {
        const nm = s(r, nameCol);
        const si = siCol > 0 ? s(r, siCol) : '';
        const shiftTxt = shiftCol > 0 ? s(r, shiftCol) : '';
        let hasDuty = false;
        for (const dc of dateCols) { if (clean(val(r, dc.c))) { hasDuty = true; break; } }

        // shift table (column left of SI)
        if (shiftTxt && !/^shift/i.test(shiftTxt)) {
          const m = SHIFT_RE.exec(shiftTxt);
          if (m) {
            const label = m[1].replace(/[\s\-–:]+$/, '').trim();
            const time = `${fmtTime(m[2])}–${fmtTime(m[3])}`;
            if (label && !sheetShifts.some(x => x.raw === shiftTxt)) sheetShifts.push(makeShift(label, time, shiftTxt));
          }
          else if (/^pt[-\s]?cct$|part[-\s]?tim/i.test(shiftTxt)) { /* group marker handled below */ }
        }

        // legend row: short code in SI column + description in Name column, no duties
        const codeLike = x => /^[A-Z][A-Z/]{1,6}$/.test(x) && !/^P\d+$/.test(x);
        const isCode = codeLike(si);
        const nextIsCode = siCol > 0 && codeLike(s(r + 1, siCol)) && !!s(r + 1, nameCol);
        if (isCode && nm && (!hasDuty || inLegend || nextIsCode)) {
          inLegend = true;
          const code = si.toUpperCase();
          const time = shiftTxt && /^\d{1,2}:?\d{2}\s*[-–]\s*\d{1,2}:?\d{2}$/.test(shiftTxt) ? shiftTxt.split(/[-–]/).map(x => fmtTime(x.trim())).join('–') : (legend[code] && legend[code].time) || null;
          legend[code] = { code, meaning: nm, time };
          continue;
        }
        if (!nm) { if (hasDuty && !inLegend) unnamedRows++; continue; }
        if (inLegend) continue;
        // section header e.g. "PART TIMERS"
        const allCaps = /[A-Z]{3}/.test(nm) && !/[a-z]/.test(nm);
        if (!si && allCaps && (!hasDuty || /\b(part|full)[\s-]?timers?\b|\btrainers\b|\bstaff\b/i.test(nm))) {
          group = /part/i.test(nm) ? 'Part-time' : /full/i.test(nm) ? 'Full-time' : nm.replace(/\b\w+/g, w => w[0] + w.slice(1).toLowerCase());
          continue;
        }
        if (/^\d+$/.test(nm)) continue;
        const rowGroup = /^pt[-\s]?cct$/i.test(shiftTxt) ? 'Part-time' : group;

        const key = nameKey(nm);
        if (!key) continue;
        trainerRows++;
        const parts = nameParts(nm);
        let t = trainerMap.get(key);
        if (!t) { t = { id: key.replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''), key, name: parts.display, tags: [], appearances: [] }; trainerMap.set(key, t); }
        for (const tg of parts.tags) if (!t.tags.includes(tg)) t.tags.push(tg);
        const qualRaw = qualCol > 0 ? clean(val(r, qualCol)) : '';
        let leftFrom = null, leftCount = 0;
        for (const dc of dateCols) if (sh.leftCells.has(r + ',' + dc.c)) { leftCount++; if (!leftFrom) leftFrom = dc.date; }
        if (leftCount < 7) leftFrom = null; // a longer grey stretch marks a trainer who has left
        t.appearances.push({ leftFrom, sheet: sh.name, order: sheetOrder, end: dateCols[dateCols.length - 1].date, row: r, qualRaw, qualCell: qualCol > 0 ? addr(r, qualCol) : null, group: rowGroup, name: parts.display, hiddenRow: sh.hiddenRows.has(r) });

        for (const dc of dateCols) {
          const raw = val(r, dc.c);
          const v = txt(raw).replace(/\r/g, '').trim();
          if (!v) continue;
          const e = { t: t.id, d: dc.date, v, s: sh.name, c: addr(r, dc.c) };
          const note = sh.comments.get(r + ',' + dc.c);
          if (note) e.n = note;
          if (typeof raw === 'number') e.num = 1;
          entries.push(e);
          cellCount++;
        }
      }
      if (sheetShifts.length) shifts[sh.name] = sheetShifts;
      if (unnamedRows) info.push({ sheet: sh.name, message: `${unnamedRows} row${unnamedRows > 1 ? 's' : ''} with duty values but no Trainer name ${unnamedRows > 1 ? 'were' : 'was'} ignored.` });
      sheetsRead.push({ name: sh.name, from: dateCols[0].date, to: dateCols[dateCols.length - 1].date, trainers: trainerRows, cells: cellCount, order: sheetOrder });
    });

    progress('Reading duties and qualifications…');
    if (!sheetsRead.length) {
      throw userError('We couldn’t find any Trainer duties in this file.', 'No sheet had a “Name” column with a row of day numbers and a recognisable month. Sheets: ' + wb.sheets.map(x => `${x.name}${x.hidden ? ' (hidden)' : ''}`).join(', '));
    }

    // overlapping sheets: same trainer & date from two sheets
    const latestSheet = sheetsRead.slice().sort((a, b) => a.to < b.to ? 1 : a.to > b.to ? -1 : b.order - a.order)[0];
    const trainers = [];
    const departed = [];
    let order = 0;
    for (const t of trainerMap.values()) {
      const apps = t.appearances.slice().sort((a, b) => a.end < b.end ? 1 : a.end > b.end ? -1 : b.order - a.order);
      const latest = apps[0];
      if (latest.leftFrom) { departed.push({ id: t.id, name: latest.name, from: latest.leftFrom, sheet: latest.sheet, reason: 'grey' }); continue; }
      if (latest.sheet !== latestSheet.name) { departed.push({ id: t.id, name: latest.name, from: null, sheet: latest.sheet, reason: 'notOnLatest' }); continue; }
      const quals = splitQuals(latest.qualRaw);
      trainers.push({
        id: t.id, name: latest.name, tags: t.tags,
        group: latest.group || null,
        current: latest.sheet === latestSheet.name,
        qualifications: quals,
        qualSource: { sheet: latest.sheet, cell: latest.qualCell, raw: latest.qualRaw },
        sheets: [...new Set(apps.map(a => a.sheet))],
        order: latest.sheet === latestSheet.name ? latest.row : 10000 + (order++)
      });
    }
    trainers.sort((a, b) => a.order - b.order);
    if (departed.length) {
      const gone = new Set(departed.map(x => x.id));
      for (let i = entries.length - 1; i >= 0; i--) if (gone.has(entries[i].t)) entries.splice(i, 1);
      const g = departed.filter(x => x.reason === 'grey'), o = departed.filter(x => x.reason !== 'grey');
      if (g.length) info.push({ message: `Not shown — row marked in grey (White, Darker 50%) as no longer in the company: ${g.map(x => x.name).join(', ')}.` });
      if (o.length) info.push({ message: `Not shown — not listed on the latest roster sheet (${latestSheet.name.trim()}): ${o.map(x => x.name).join(', ')}.` });
    }

    // duplicate trainer-date across different sheets
    const dup = new Map();
    for (const e of entries) { const k = e.t + '|' + e.d; if (!dup.has(k)) dup.set(k, []); dup.get(k).push(e); }
    for (const [k, list] of dup) {
      if (list.length > 1) {
        const vals = [...new Set(list.map(x => clean(x.v).toLowerCase()))];
        if (vals.length > 1) {
          const tr = trainers.find(x => x.id === list[0].t);
          warn({ type: 'conflict', sheet: list.map(x => x.s).join(' / '), cell: list.map(x => x.c).join(', '), trainer: tr ? tr.name : '', date: list[0].d, value: list.map(x => x.v).join(' | '), message: 'More than one value for the same Trainer and date. Both are shown.' });
        }
      }
    }

    // unrecognised values
    const unknown = new Map();
    for (const e of entries) {
      const it = interpret(e.v, legend);
      if (it.unrecognised) {
        const k = clean(e.v);
        if (!unknown.has(k)) unknown.set(k, []);
        unknown.get(k).push(e);
      }
      if (e.num) {
        const tr = trainers.find(x => x.id === e.t);
        warn({ type: 'value', sheet: e.s, cell: e.c, trainer: tr ? tr.name : '', date: e.d, value: e.v, message: 'A number was entered where a duty was expected. It is shown exactly as written.' });
      }
    }
    const notes = [];
    for (const [v, list] of unknown) {
      if (list.some(e => e.num)) continue;
      const tr = trainers.find(x => x.id === list[0].t);
      notes.push({ type: 'unknown', value: v, count: list.length, sheet: list[0].s, cell: list[0].c, trainer: tr ? tr.name : '', date: list[0].d, message: `“${v}” isn’t in the workbook legend. It is shown exactly as written${list.length > 1 ? ` (${list.length} cells)` : ''}.` });
    }

    const dates = [...covered].sort();
    const qualSet = new Set(); trainers.forEach(t => t.qualifications.forEach(q => qualSet.add(q.toUpperCase())));
    if (!Object.keys(legend).length) info.push({ message: 'No duty-code legend was found. Codes are shown exactly as written.' });

    return {
      schema: 1,
      source: { filename: wb.filename, sizeBytes: wb.sizeBytes, modified: wb.modified, sheetsRead: sheetsRead.map(({ order, ...x }) => x), sheetsSkipped, latestSheet: latestSheet.name },
      period: { start: dates[0], end: dates[dates.length - 1] },
      covered: compressDates(dates),
      legend, shifts, trainers, departed, entries, warnings, notes: notes.sort((a, b) => b.count - a.count), info,
      stats: { trainers: trainers.length, currentTrainers: trainers.filter(t => t.current).length, duties: entries.length, qualifications: qualSet.size, warnings: warnings.length }
    };
  }

  function makeShift(label, time, raw) {
    const batches = [];
    const bm = /^batch\s*(\d+)$/i.exec(label);
    if (bm) batches.push(+bm[1]);
    const phrases = [];
    if (!bm) {
      let prevWord = '';
      for (let p of label.split(/\s*(?:&|\/|,|\band\b)\s*/i)) {
        p = p.trim(); if (!p) continue;
        if (/^\d+$/.test(p) && prevWord) p = prevWord + ' ' + p;
        else { const w = /^(.*?)\s*\d+$/.exec(p); prevWord = w ? w[1] : p; }
        phrases.push(p.toLowerCase());
      }
    }
    return { label, time, raw, batches, phrases };
  }

  function splitQuals(raw) {
    if (!raw) return [];
    const out = [];
    for (let p of raw.split(/\s*(?:,|&|\/|;|\band\b)\s*/i)) {
      p = p.trim(); if (!p) continue;
      const disp = /^[a-z]+$/i.test(p) && p.length <= 6 && p === p.toUpperCase() ? p : p.replace(/\b([a-z])/g, c => c.toUpperCase());
      if (!out.some(x => x.toUpperCase() === disp.toUpperCase())) out.push(disp);
    }
    return out;
  }

  function compressDates(dates) {
    const ranges = []; let s = null, prev = null;
    for (const d of dates) {
      if (s && nextDay(prev) === d) { prev = d; continue; }
      if (s) ranges.push([s, prev]);
      s = d; prev = d;
    }
    if (s) ranges.push([s, prev]);
    return ranges;
  }
  function expandDates(ranges) { const out = []; for (const [a, b] of ranges) { let d = a; while (d <= b) { out.push(d); d = nextDay(d); } } return out; }
  function nextDay(d) { const [y, m, dd] = d.split('-').map(Number); const x = new Date(Date.UTC(y, m - 1, dd + 1)); return x.toISOString().slice(0, 10); }
  function addDays(d, n) { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); }

  /* ---------------- 3. Interpreter ---------------- */
  // Category keywords apply only to visual grouping. The original value is always what is displayed.
  const TRAINING_WORDS = /\b(batch|sep|avsec|avmed|crm|dg|sms|svc|fa|induction|fashion|hospitality|sccm|purser|ttti?|rec|fc|cc|stt|pilots?|training|initial|recurrent|assessment|leadership|workshop|remedial|refresh|sign\s?off|concordance|j-class|e-learning)\b/i;
  const OFFICE_EXTRA = new Set(['OFC']);
  function categoryFromMeaning(meaning) {
    const m = meaning.toLowerCase();
    if (/leave|sick|matern/.test(m)) return 'leave';
    if (/day off|lieu|holiday|\brest\b/.test(m)) return 'off';
    if (/office|home|admin/.test(m)) return 'office';
    if (/train/.test(m)) return 'training';
    if (/travel/.test(m)) return 'other';
    return 'other';
  }
  const interpCaches = new WeakMap();

    if (this.db) {
      const vs = await this.versions();
      const n = Math.max(1, ...vs.map(v => v.version)) + 1;
      const parts = [];
      for (let i = 0; i < gz.length; i += PART) parts.push(gz.slice(i, i + PART));
      const meta = { ...metaFor(model, n, new Date().toISOString(), prev, false), parts: parts.length };
      try {
        for (let i = 0; i < parts.length; i++) await this.db.doc('roster_parts/' + vid(n) + '-' + i).set({ gz: parts[i], version: n });
        await this.db.doc('roster_versions/' + vid(n)).set(meta);
        await this.db.doc('roster/active').set(meta);
      } catch (err) {
        if (err && err.code === 'invalid_argument') { S.canPublish = false; const e = new Error('Only people with edit access to TrainerDuties can publish a new roster for the team.'); e.userMessage = e.message; throw e; }
        if (err && err.code === 'quota_exceeded') { const e = new Error('The roster store is full. Older versions need to be removed before a new one can be published.'); e.userMessage = e.message; throw e; }
        throw err;
      }

      await IDB.set('ver:' + n, { meta, gz });
      this.prune(vs.filter(v => !v.builtIn).map(v => v.version).concat(n));
      return { meta, model };
    }
    const vs = await this.versions();
    const n = Math.max(0, ...vs.map(v => v.version)) + 1;
    const meta = { ...metaFor(model, n, new Date().toISOString(), prev, false), device: true };
    const ok = await IDB.set('ver:' + n, { meta, gz });
    if (!ok) { const e = new Error('This browser couldn’t save the roster. Storage may be full or disabled.'); e.userMessage = e.message; throw e; }

  async prune(nums) {

        const d = await this.db.doc('roster_versions/' + vid(n)).get();
        const parts = d.exists ? d.data().parts : 0;
        for (let i = 0; i < parts; i++) await this.db.doc('roster_parts/' + vid(n) + '-' + i).delete();
        await this.db.doc('roster_versions/' + vid(n)).delete();

      IDB.del('ver:' + n);
    }
  }
};

/* ---------- lock: the built-in roster is encrypted with the team password ---------- */
const u8FromB64 = b64 => new Uint8Array(TD.b64ToBuf(b64));

  bytes: null,
  enc: BUILTIN.enc,
  async derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: u8FromB64(this.enc.salt), iterations: this.enc.iter }, base, 256);
    return new Uint8Array(bits);
  },
  async open(raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    this.bytes = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8FromB64(this.enc.iv), additionalData: new TextEncoder().encode(this.enc.aad) }, key, u8FromB64(this.enc.ct));
  },
  async tryRemembered() {
    let k = null;
    try { k = prefs.get('lk', null) || (sess && sess.getItem('td.lk')); } catch { }
    if (!k) return false;
    try { await this.open(u8FromB64(k)); return true; } catch { this.forget(); return false; }
  },
  async unlock(pw, remember) {
    const raw = await this.derive(pw);
    try { await this.open(raw); } catch { return false; }
    const k = b64FromU8(raw);
    if (remember) prefs.set('lk', k); else { prefs.del('lk'); try { sess && sess.setItem('td.lk', k); } catch { } }
    return true;
  },
  forget() { prefs.del('lk'); try { sess && sess.removeItem('td.lk'); } catch { } }
};
function showLock() {

        <div class="pw-field">

          <button type="button" class="pw-eye" id="pwEye" aria-label="Show password" aria-pressed="false">${I.eye}</button>

/* ---------- hidden trainers: never shown, whatever workbook is uploaded ---------- */
const HIDDEN_DEFAULT_H = new Set(['aaaadb28', '91c10c19']); // default hidden trainers (stored as hashes, not names)
const fnv = str => { let h = 0x811c9dc5; for (const b of new TextEncoder().encode(str)) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };
const Hidden = {
  list: (() => { const l = prefs.get('hidden', null); return Array.isArray(l) ? l : null; })(), // null = defaults
  of(m) {
    if (this.list) return this.list;
    const pool = [...((m && m.trainers) || []), ...((m && m.departed) || [])];
    const seen = new Set();
    return pool.filter(t => HIDDEN_DEFAULT_H.has(fnv(t.id)) && !seen.has(t.id) && seen.add(t.id)).map(t => ({ id: t.id, name: t.name }));
  },
  view() { return this.of(S.raw); },
  ids(m) { return new Set(this.of(m || S.raw).map(x => x.id)); },
  sig() { return this.list ? this.list.map(x => x.id).sort().join('|') : 'default'; },
  set(list) {
    this.list = list; prefs.set('hidden', list);
    if (S.raw) setActive(S.raw, S.meta, { quiet: true });
  },
  async save(list) { this.set(list); }
};
const hiddenMemo = new WeakMap();
function applyHidden(m) {
  if (!m) return m;
  const sig = Hidden.sig(), c = hiddenMemo.get(m);
  if (c && c.sig === sig) return c.v;
  const h = Hidden.ids(m);
  const trainers = m.trainers.filter(t => !h.has(t.id));
  const entries = m.entries.filter(e => !h.has(e.t));
  const v = { ...m, trainers, entries, stats: { ...m.stats, trainers: trainers.length, currentTrainers: trainers.filter(t => t.current).length, duties: entries.length } };
  hiddenMemo.set(m, { sig, v });
  return v;
}

async function setActive(model, meta, { quiet } = {}) {

async function boot() {

  }

  const remembered = prefs.get('me', null) || (sess && sess.getItem('td.me'));
  S.me = remembered || null;

async function connect() {
  let db = null;
  if (!window.TD_LOCAL_ONLY) {
    try {
      if (window.claude && typeof window.claude.use === 'function')
        db = await Promise.race([window.claude.use('db'), new Promise(r => setTimeout(() => r(null), 5000))]);
    } catch { db = null; }
  }
  if (db) {
    Roster.db = db; S.mode = 'shared';
    db.doc('config/hidden').onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      const list = d && Array.isArray(d.list) ? d.list : null;
      if (JSON.stringify(list) !== JSON.stringify(Hidden.list)) Hidden.set(list);
    }, () => { });
    let first = true;
    db.doc('roster/active').onSnapshot(async snap => {
      try {
        if (!snap.exists) {
          S.status = { kind: 'ok', text: 'Team roster' };
        } else {
          const meta = snap.data();
          if (!S.meta || S.meta.version !== meta.version) {
            S.status = { kind: 'busy', text: 'Loading the latest roster…' }; renderStatus();
            const m = await Roster.loadVersion(meta.version);
            if (m) await setActive(m, meta, { quiet: false });
          }
          S.status = { kind: 'ok', text: 'Team roster' };
        }
        if (first) { first = false; checkPersonalChanges(); }
        renderStatus();
      } catch (err) {
        console.error(err);
        S.status = { kind: 'warn', text: 'Couldn’t check for updates — showing the last roster loaded' }; renderStatus();
      }
    }, () => { S.status = { kind: 'warn', text: 'Live updates paused — showing the last roster loaded' }; renderStatus(); });
  } else {
    S.mode = 'device';
    const n = prefs.get('deviceActive', null);
    if (n && (!S.meta || S.meta.version !== n)) {
      const m = await Roster.loadVersion(n); const meta = await Roster.metaOf(n);
      if (m && meta) await setActive(m, meta, { quiet: true });
    }
    S.status = { kind: 'ok', text: 'Saved on this device' };
    renderStatus();
    checkPersonalChanges();
  }
}

/* ---------- diff helpers ---------- */
async function currentDiff() {
  if (S.diff && S.diffBase === S.meta.previous) return S.diff;
  if (!S.meta || !S.meta.previous) return null;
  const old = await Roster.loadVersion(S.meta.previous);

  S.diff = TD.diff(applyHidden(old), S.model); S.diffBase = S.meta.previous;

async function checkPersonalChanges() {

}
async function checkPersonalChangesInner() {
  const seen = prefs.get('seen', null);

  if (seen === S.meta.version) return;
  let base = seen;
  let old = await Roster.loadVersion(base).catch(() => null);
  if (!old && S.meta.previous) { base = S.meta.previous; old = await Roster.loadVersion(base).catch(() => null); }
  prefs.set('seen', S.meta.version);
  if (!old) return;
  const d = TD.diff(applyHidden(old), S.model);
  const mine = d.changes.filter(c => c.t === S.me);
  const newMonths = d.monthsAdded;
  if (!mine.length && !newMonths.length) return;
  openSheet(`
    <div class="sheet-head"><div class="t"><p class="label">Roster updated to version ${S.meta.version}</p><h2>${mine.length ? 'Your duties changed' : 'New dates added'}</h2>
    <p class="muted" style="margin-top:4px">${mine.length ? `${mine.length} change${mine.length > 1 ? 's' : ''} found` : ''}${newMonths.length ? `${mine.length ? '. ' : ''}New period: ${newMonths.map(fMonthYS).join(', ')}` : ''}</p></div>

}

function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function horizon(it, e) {
  // the dot marks how far through today we are (or through the listed hours)
  const now = new Date(); let f = (now.getHours() * 60 + now.getMinutes()) / 1440;
  const tm = e && timeOf(e, it);
  const m = tm && /(\d{2}):(\d{2})–(\d{2}):(\d{2})/.exec(tm.text);
  if (m) { const a = +m[1] * 60 + +m[2], b = +m[3] * 60 + +m[4], n = now.getHours() * 60 + now.getMinutes(); f = b > a ? Math.min(1, Math.max(0, (n - a) / (b - a))) : f; }

  const px = (1 - f) ** 2 * x0 + 2 * (1 - f) * f * 300 + f * f * x1, py = (1 - f) ** 2 * y0 + 2 * (1 - f) * f * 60 + f * f * y1;
  return `<svg class="horizon" viewBox="0 0 600 280" preserveAspectRatio="none" aria-hidden="true"><path d="M${x0} ${y0} Q300 60 ${x1} ${y1}"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4"/></svg>`;
}

/* ---------- duty detail ---------- */

  const kv = [];
  if (it.meaning) kv.push(['Meaning', esc(it.meaning) + (it.note ? ` — ${esc(it.note)}` : ''), 'From the workbook legend']);

/* ---------- Calendar ---------- */
function calendarHTML(t, ym, sel, mini) {
  const months = S.idx.months;
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const lead = (first.getDay() + 6) % 7; // Monday first
  const days = new Date(y, m, 0).getDate();
  const i = months.indexOf(ym);
  const cells = [];
  for (let k = 0; k < lead; k++) cells.push('<span class="cal-day out" aria-hidden="true"></span>');
  const td = today();
  for (let dd = 1; dd <= days; dd++) {
    const iso = `${ym}-${pad(dd)}`;
    const x = dutyOf(t, iso);
    const cov = S.idx.covered.has(iso);
    const lbl = x ? (x.multi ? x.its.map(z => z.short).join(' / ') : x.it.short) : '';
    cells.push(`<button class="cal-day ${x ? 'cat-' + x.it.category : ''} ${cov ? '' : 'nodata'} ${iso === td ? 'today' : ''}" data-cal="${iso}" aria-pressed="${sel === iso}" aria-label="${esc(fLong(iso))}: ${esc(x ? x.value : cov ? 'Not specified' : 'Outside roster period')}"><span class="n">${dd}</span>${x ? `<span class="l">${esc(lbl)}</span>` : ''}</button>`);
  }
  return `<div class="cal-head">
      <h2>${esc(fMonthY(ym))}</h2>
      ${mini ? '' : `<button class="link-btn" data-caltoday>Today</button>`}
      <button class="round" data-calnav="-1" aria-label="Previous month" ${i <= 0 ? 'disabled' : ''}>${I.left}</button>
      <button class="round" data-calnav="1" aria-label="Next month" ${i < 0 || i >= months.length - 1 ? 'disabled' : ''}>${I.right}</button>
    </div>
    <div class="cal-grid ${mini ? '' : 'cal-anim'}" style="--dx:${S._calDx || 0}px">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((w, k) => `<span class="cal-dow" aria-hidden="true">${w}</span>`).join('')}${cells.join('')}</div>
    ${mini ? '' : `<div class="legend">${CATS.map(([c, n]) => `<span class="cat-${c}"><i></i>${n}</span>`).join('')}</div>`}`;
}

function dayPanel(t, d) {

function bindCalendar(t, mini) {
  const box = mini ? $('.rail .cal') : $('#calBox');
  if (!box) return;
  box.addEventListener('click', e => {
    const nav = e.target.closest('[data-calnav]');
    if (nav) {
      const dir = +nav.dataset.calnav;
      const cur = mini ? (box.dataset.ym || today().slice(0, 7)) : S.calMonth;
      const i = S.idx.months.indexOf(cur);
      const next = S.idx.months[i + dir];
      if (!next) return;
      S._calDx = dir * 10;
      if (mini) { box.dataset.ym = next; box.innerHTML = calendarHTML(t, next, null, true); }
      else { S.calMonth = next; S.calSel = null; box.innerHTML = calendarHTML(t, next, null, false); $('#calDetail').innerHTML = `<div class="panel glass"><p class="muted">Select a day to see the duty.</p></div>`; }
      return;
    }
    if (e.target.closest('[data-caltoday]')) { S.calMonth = today().slice(0, 7); S.calSel = today(); if (!S.idx.months.includes(S.calMonth)) S.calMonth = S.idx.months[S.idx.months.length - 1]; render(); return; }
    const day = e.target.closest('[data-cal]');
    if (!day) return;
    const d = day.dataset.cal;
    if (mini) { S.calMonth = d.slice(0, 7); S.calSel = d; S.viewTrainer = null; openDuty(t, d); return; }
    S.calSel = d;
    $$('[data-cal]', box).forEach(b => b.setAttribute('aria-pressed', b.dataset.cal === d));
    const det = $('#calDetail');
    det.innerHTML = dayPanel(t, d);
    bindDuty(det);
    if (window.matchMedia('(max-width: 899px)').matches) openDuty(t, d);

}
after.calendar = () => {
  bindCalendar(calTarget(), false); bindDuty($('#calDetail'));
  const w = $('#calWho'); if (w) w.addEventListener('change', () => { S.viewTrainer = w.value === S.me ? null : w.value; S.calSel = null; render(); });
  const m = $('[data-mine]'); if (m) m.addEventListener('click', () => { S.viewTrainer = null; S.calSel = null; render(); });
};

/* ---------- Team ---------- */
function viewTeam() {
  const td = today();
  if (!S.teamDate) S.teamDate = S.idx.covered.has(td) ? td : S.model.period.end;
  const tabs = `<div class="seg" role="group" aria-label="Team view"><button data-tmode="date" aria-pressed="${S.teamMode === 'date'}">By date</button><button data-tmode="trainer" aria-pressed="${S.teamMode === 'trainer'}">By Trainer</button></div>`;
  let body = '';
  if (S.teamMode === 'date') {
    const d = S.teamDate;
    const q = S.teamQ.toLowerCase();
    const rows = [], empty = [];
    const counts = {};
    for (const t of S.model.trainers) {
      const x = dutyOf(t.id, d);
      if (!x && !t.current) continue;
      if (q && !t.name.toLowerCase().includes(q) && !(x && x.value.toLowerCase().includes(q)) && !t.tags.some(g => g.toLowerCase().includes(q))) continue;
      if (x) counts[x.it.category] = (counts[x.it.category] || 0) + 1;
      if (S.teamCat !== 'all' && (!x || x.it.category !== S.teamCat)) continue;
      (x ? rows : empty).push({ t, x });
    }
    const li = ({ t, x }) => `<button class="li ${x ? 'cat-' + x.it.category : 'dim'}" data-duty="${esc(t.id)}|${d}" ${x ? '' : 'disabled'}>

/* ---------- Search ---------- */
function hl(text, q) {
  const s = String(text ?? '');
  if (!q) return esc(s);
  const i = s.toLowerCase().indexOf(q);
  if (i < 0) return esc(s);
  return '<span>' + esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)) + '</span>';
}
function parseDateQuery(q) {
  let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(q);
  if (m) return q;
  m = /^(\d{1,2})[\s/.-]*([a-z]{3,9})\.?(?:[\s/.-]*(\d{2,4}))?$/i.exec(q) || null;
  let d, mo, y;
  if (m) { d = +m[1]; mo = TD.MONTHS.findIndex(x => x.startsWith(m[2].toLowerCase())); y = m[3]; }
  else { const n = /^([a-z]{3,9})\.?\s+(\d{1,2})(?:,?\s*(\d{2,4}))?$/i.exec(q); if (n) { mo = TD.MONTHS.findIndex(x => x.startsWith(n[1].toLowerCase())); d = +n[2]; y = n[3]; } }
  if (mo == null || mo < 0 || !d) { const k = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(q); if (k) { d = +k[1]; mo = +k[2] - 1; y = k[3]; } }
  if (mo == null || mo < 0 || !d || d > 31) return null;
  const cands = [];
  if (y) { y = +y < 100 ? 2000 + +y : +y; cands.push(y); } else { const ty = new Date().getFullYear(); cands.push(ty, ty + 1, ty - 1); }
  for (const yy of cands) { const iso = `${yy}-${pad(mo + 1)}-${pad(d)}`; if (S.idx.covered.has(iso)) return iso; }
  return null;
}
function viewSearch() {
  const raw = S.searchQ.trim(), q = raw.toLowerCase();
  let res = '';
  if (q.length >= 2) {
    const td = today();
    const trainers = S.model.trainers.filter(t => t.name.toLowerCase().includes(q) || t.tags.some(g => g.toLowerCase().includes(q)));
    const date = parseDateQuery(raw);
    const batchN = /^(?:batch\s*|b)?(\d{1,3})$/i.exec(raw);
    const duties = [];
    for (const e of S.model.entries) {
      const it = S.idx.it(e);
      if (e.v.toLowerCase().includes(q) || (batchN && it.batches.includes(+batchN[1])) || (e.n && e.n.toLowerCase().includes(q))) duties.push(e);
    }
    duties.sort((a, b) => { const fa = a.d >= td, fb = b.d >= td; if (fa !== fb) return fa ? -1 : 1; return fa ? (a.d < b.d ? -1 : a.d > b.d ? 1 : 0) : (a.d > b.d ? -1 : 1); });
    const shown = duties.slice(0, S._searchMore ? 300 : 40);
    const sec = (title, n, html) => `<div class="section-head"><h2>${title}</h2><span class="faint small">${n}</span></div>${html}`;
    if (trainers.length) res += sec('Trainers', trainers.length, `<div class="list glass">${trainers.map(t => { const x = dutyOf(t.id, td); return `<button class="li" data-sr-t="${esc(t.id)}"><span class="initials">${esc(initials(t.name))}</span><span class="body"><span class="name">${hl(t.name, q)}</span><span class="sub small">${x ? 'Today: ' + esc(x.value) : 'Today: not specified'}</span></span></button>`; }).join('')}</div>`);
    if (date) res += sec('Date', '', `<div class="list glass"><button class="li" data-sr-d="${date}"><span class="initials">${parseISO(date).getDate()}</span><span class="body"><span class="name">${esc(fLong(date))}</span><span class="sub small">See who is working</span></span></button></div>`);
    if (duties.length) res += sec('Duties', duties.length, `<div class="board glass">${shown.map(e => { const it = S.idx.it(e); return `<button class="board-row cat-${it.category} ${e.d < td ? 'past' : ''}" data-duty="${esc(e.t)}|${e.d}"><span class="d">${esc(fDMUp(e.d))}<small>${esc(e.d.slice(0, 4))}</small></span><span class="v"><i class="bar"></i><span><b>${esc(T(e.t).name)}</b><br>${hl(e.v, q)}</span></span><span></span></button>`; }).join('')}</div>${duties.length > shown.length ? `<button class="btn block" style="margin-top:10px" data-more>Show more</button>` : ''}`);
    if (!res) res = `<div class="empty glass" style="margin-top:14px"><h2>Nothing found</h2><p>No Trainer, duty or date matches “${esc(raw)}”.</p></div>`;
  } else res = `<p class="muted" style="padding:16px 4px">Try a name (Gary), a duty (AVSEC), a batch (45), or a date (24 Sep).</p>`;
  return `<div class="wrap"><div class="page-head"><h1>Search</h1></div>
    <div class="search">${I.search}<input id="sq" type="search" placeholder="Search Trainer, duty, date or batch…" value="${esc(raw)}" autocomplete="off" aria-label="Search"></div>
    <div id="sres">${res}</div></div>`;
}

    drop.addEventListener('drop', e => { const file = e.dataTransfer.files[0]; if (file) startImport(file); });
